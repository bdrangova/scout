  [[HEADER:files]]
  [[BAR:deck]]
  <div class="main">
    [[SIDEBAR:deck]]
    <main class="stage">
      <button class="nav" type="button" aria-label="Previous file">[[i:chevron-left]]</button>
      <div class="deckcol">
        <div class="deck">
          <div class="peek p2 ft-ts" aria-hidden="true"></div>
          <div class="peek p1 ft-css" aria-hidden="true"></div>
          <article class="card ft-react" aria-label="src/components/TrialBar.tsx">
            <div class="card-h">
              <span class="win-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <div class="path">
                <span class="dir mono">src/components/</span>
                <span class="line"><span class="fn mono">TrialBar.tsx</span><span class="chip add ico" title="Added" aria-label="Added">[[i:plus]]</span><span class="chip upd ico" title="Updated since last review" aria-label="Updated since last review">[[i:refresh-cw]]</span></span>
              </div>
              <div class="meta">
                <span class="delta mono"><span class="a">+39</span><span class="r">−0</span></span>
                <span class="pos" title="File 8 of 12" aria-label="File 8 of 12">[[i:files]]8 / 12</span>
                <span class="seg" role="group" aria-label="Diff layout">
                  <button class="on" type="button" aria-pressed="true" aria-label="Unified diff" title="Unified">[[i:unified]]</button>
                  <button type="button" aria-pressed="false" aria-label="Split diff" title="Split">[[i:split]]</button>
                </span>
              </div>
            </div>
            <div class="code-wrap mono" tabindex="0" aria-label="Diff of TrialBar.tsx">[[CODE]]</div>
            <button class="resolved" type="button" title="Show 1 resolved" aria-label="Show 1 resolved">[[i:chevron-right]][[i:circle-check]]1</button>
            <div class="card-f">
              <div class="compose">[[i:message-square]]<span class="ph">Leave a comment…</span><kbd>C</kbd></div>
              <div class="act">
                <div class="hint"><span class="kicon"><kbd>A</kbd>[[i:check]]</span><span class="kicon"><kbd>X</kbd>[[i:x]]</span><span class="kicon"><kbd>C</kbd>[[i:message-square]]</span></div>
                <button class="btn rej sq" type="button" title="Reject (X)" aria-label="Reject">[[i:x]]</button>
                <button class="btn sq" type="button" title="Comment (C)" aria-label="Comment">[[i:message-square]]</button>
                <button class="btn pri" type="button" title="Approve (A)" aria-label="Approve">[[i:check]]Approve</button>
              </div>
            </div>
          </article>
        </div>
        <p class="count" aria-live="polite">8 / 12</p>
      </div>
      <button class="nav" type="button" aria-label="Next file">[[i:chevron-right]]</button>
    </main>
  </div>
