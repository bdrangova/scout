<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR link options</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ===== tokens: copied from web/src/index.css (:root = light, .dark = dark) ===== */
.th-light {
  --paper: #FDF3EC; --paper-2: #F1E9DB; --surface: #F7F1E6; --sunken: #EBE2D2;
  --ink: #2B2A33; --ink-muted: #5E5A58;
  --line: rgba(43, 42, 51, .34); --fill-line: rgba(43, 42, 51, .36); --sh: rgba(43, 42, 51, .2); --hover: rgba(43, 42, 51, .08);
  --hdr-bg: #F6B21E; --hdr-ink: #2B2A33; --hdr-chip: #F7F1E6;
  --yellow: #F6B21E; --on-yellow: #2B2A33; --blue: #A9B7E0; --on-blue: #2B2A33; --pink: #F58FAB; --cyan: #2FB8B0;
  --red: #B8341F; --red-solid: #CF3F2B; --coral: #EE5A45; --on-red: #FFFFFF; --green: #2A7A58; --mint: #BFE3B4;
  --warn-bg: #FCEBC3; --warn-bd: #9A6A00; --warn-ic: #F6B21E;
  --info-bg: #E2E8F8; --info-bd: #4B63B0; --info-ic: #A9B7E0;
  --ok-bg: #DCEFD9; --ok-bd: #2A7A58; --ok-ic: #8CD3A0;
  --err-bg: #FBDDD6; --err-bd: #B8341F; --err-ic: #EE5A45;
  --focus: #2F5DA8;
  --diff-add: #DCEBD6; --diff-add-gutter: #BBD9B3; --diff-del: #FBDDD6; --code-bg: #F7F1E6;
  --tk-k: #A63A6E; --tk-s: #276B44; --tk-f: #2F5DA8; --tk-t: #1E7070; --tk-n: #9A4513; --tk-p: #645F5A; --tk-i: #2B2A33;
  --st-a: #2A7A58; --st-m: #D9930D; --st-r: #4B63B0; --st-d: #B8341F;
  --ft-ts: #7C9BE8; --ft-js: #F4D35E; --ft-react: #4FC3D9; --ft-yaml: #F29B5B; --ft-json: #8ACB8F; --ft-css: #EE8FB6; --ft-other: #D9CDB5;
  --scrim: rgba(43, 42, 51, .34);
}
.th-dark {
  --paper: #23212B; --paper-2: #2A2833; --surface: #2E2B38; --sunken: #1D1B24;
  --ink: #F3ECDD; --ink-muted: #B3ADC0;
  --line: rgba(176, 168, 214, .58); --fill-line: rgba(35, 33, 43, .42); --sh: rgba(0, 0, 0, .38); --hover: rgba(243, 236, 221, .08);
  --hdr-bg: #8DA5E8; --hdr-ink: #23212B; --hdr-chip: #F3ECDD;
  --yellow: #86A3EC; --on-yellow: #23212B; --blue: #CBD5F3; --on-blue: #23212B; --pink: #F2A0B8; --cyan: #4DBDB6;
  --red: #F58B79; --red-solid: #F07A67; --coral: #F07A67; --on-red: #23212B; --green: #8CD3A0; --mint: #8CD3A0;
  --warn-bg: rgba(134, 163, 236, .16); --warn-bd: #86A3EC; --warn-ic: #86A3EC;
  --info-bg: rgba(169, 183, 224, .15); --info-bd: #A9B7E0; --info-ic: #A9B7E0;
  --ok-bg: rgba(140, 211, 160, .15); --ok-bd: #8CD3A0; --ok-ic: #8CD3A0;
  --err-bg: rgba(240, 122, 103, .15); --err-bd: #F07A67; --err-ic: #F07A67;
  --focus: #A9B7E0;
  --diff-add: rgba(140, 211, 160, .12); --diff-add-gutter: rgba(140, 211, 160, .26); --diff-del: rgba(240, 122, 103, .12); --code-bg: #26242F;
  --tk-k: #F2A0C4; --tk-s: #9ADFAE; --tk-f: #9DB6F2; --tk-t: #6FD2CC; --tk-n: #F2B27A; --tk-p: #A39DB5; --tk-i: #F3ECDD;
  --st-a: #8CD3A0; --st-m: #E8A27C; --st-r: #9DB6F2; --st-d: #F58B79;
  --ft-ts: #8FA9F0; --ft-js: #E8C95A; --ft-react: #5CCBD6; --ft-yaml: #F2A06A; --ft-json: #8FD39A; --ft-css: #F2A0C4; --ft-other: #B9B2C6;
  --scrim: rgba(0, 0, 0, .5);
}

/* ===== frame (a themed screen) ===== */
.fr { --header-control-h: 34px; width: 1440px; height: 900px; position: relative; overflow: hidden; display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink); font: 14px/1.4 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.fr.f800 { width: 800px; }
.fr *, .fr *::before, .fr *::after { box-sizing: border-box; border-color: var(--line); }
.fr .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.fr .mono, .fr .mono * { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; }
.fr .sp { flex: 1; min-width: 0; }
.fr .mut { color: var(--ink-muted); }
.fr .trunc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fr .dim { color: var(--ink-muted); }
.fr strong, .fr b { font-weight: 700; }

/* header band */
.hdr { display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--hdr-bg); color: var(--hdr-ink); border-bottom: 1.5px solid var(--line);
  --line: color-mix(in srgb, var(--hdr-ink) 34%, transparent); --sh: color-mix(in srgb, var(--hdr-ink) 20%, transparent); flex: none; position: relative; z-index: 5; }
.hdr.top { align-items: flex-start; }
.hb { display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex: none; height: 34px; min-width: 34px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--hdr-chip); color: var(--hdr-ink);
  box-shadow: 1.5px 1.5px 0 var(--sh); font-weight: 700; font-size: 13px; white-space: nowrap; }
.hb.lab { padding: 0 12px; }
.tk { display: inline-flex; align-items: center; gap: 6px; flex: none; height: 34px; padding: 0 11px; border: 1.5px solid var(--fill-line); border-radius: 10px; background: var(--blue); color: var(--on-blue);
  font: 700 13px 'Geist Mono', monospace; box-shadow: 1.5px 1.5px 0 var(--sh); letter-spacing: .01em; }
.tk .ic { width: 13px; height: 13px; stroke-width: 2.5; }
.tk.sm { height: 28px; padding: 0 9px; font-size: 12px; border-radius: 9px; }
.tk.more { background: var(--hdr-chip); color: var(--hdr-ink); padding: 0 8px; border-color: var(--line); }
.tks { display: flex; gap: 8px; min-width: 0; flex: none; }
.tks.tkpeek { max-width: 190px; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 78%, transparent); mask-image: linear-gradient(to right, #000 78%, transparent); }
.ttl { font-weight: 700; font-size: 17px; line-height: 22px; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.idc { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 280px; padding-top: 0; }
.idl { display: flex; align-items: center; gap: 6px; font: 500 12px/18px 'Geist Mono', monospace; min-width: 0; }
.rp { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper-2); color: var(--ink);
  font-size: 11.5px; font-weight: 700; white-space: nowrap; min-width: 0; }
.tag .ic { width: 12px; height: 12px; stroke-width: 2.5; }
.tag.mono { font-family: 'Geist Mono', monospace; font-weight: 500; letter-spacing: .02em; }
.tag.sm { height: 20px; padding: 0 7px; font-size: 11px; }
.tag.mint { background: var(--mint); color: var(--hdr-ink); border-color: var(--fill-line); }
.tag.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn-bd) 50%, transparent); }
.tag.info { background: var(--info-bg); border-color: color-mix(in srgb, var(--info-bd) 50%, transparent); }
.tag.err { background: var(--err-bg); border-color: color-mix(in srgb, var(--err-bd) 50%, transparent); }
.tag.ok { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok-bd) 50%, transparent); }
.arr { color: var(--ink-muted); }
.hdr .arr { color: color-mix(in srgb, var(--hdr-ink) 70%, transparent); width: 12px; height: 12px; }
.sep { width: 1.5px; height: 24px; background: var(--line); border-radius: 2px; flex: none; }

/* arrow tabs: verbatim from index.css (.step-tab) */
.tabs { display: flex; align-items: stretch; flex: none; filter: drop-shadow(2px 2px 0 var(--sh)); }
.step-tab { --pt: 12px; --h: 34px; --b: 1.5px; --k: .706; --d: 1.84px; --bk: calc(var(--b) * var(--k));
  position: relative; display: flex; height: var(--h); margin-left: calc(var(--pt) * -1); background: var(--line); clip-path: var(--outer); font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--ink);
  --outer: polygon(0 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, 0 100%, var(--pt) 50%);
  --inner: polygon(calc(var(--bk) + var(--d)) 0, calc(100% - var(--pt) + var(--bk)) 0, 100% 50%, calc(100% - var(--pt) + var(--bk)) 100%, calc(var(--bk) + var(--d)) 100%, calc(var(--pt) + var(--d)) 50%); }
.step-tab-in { display: flex; align-items: center; flex: 1; margin: var(--b) 0; padding: 0 14px 0 calc(var(--pt) + 10px); clip-path: var(--inner); background: var(--surface); }
.step-tab-c { display: flex; align-items: center; gap: 6px; }
.step-tab .ic { width: 15px; height: 15px; }
.step-tab .tc { font-style: normal; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.step-tab.on { color: var(--hdr-bg); }
.step-tab.on .step-tab-in { background: var(--hdr-ink); }
.step-tab.on .tc { color: inherit; opacity: .8; }
.step-tab.ready .step-tab-in { background: var(--green); }
.step-tab.ready { color: var(--paper); }
.step-tab:first-child { margin-left: 0;
  --outer: polygon(10px 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, 10px 100%, 6.17px calc(100% - .76px), 2.93px calc(100% - 2.93px), .76px calc(100% - 6.17px), 0 calc(100% - 10px), 0 10px, .76px 6.17px, 2.93px 2.93px, 6.17px .76px);
  --inner: polygon(10px 0, calc(100% - var(--pt) + var(--bk)) 0, 100% 50%, calc(100% - var(--pt) + var(--bk)) 100%, 10px 100%, 6.73px calc(100% - .65px), 3.99px calc(100% - 2.49px), 2.15px calc(100% - 5.24px), 1.5px calc(100% - 8.5px), 1.5px 8.5px, 2.15px 5.24px, 3.99px 2.49px, 6.73px .65px); }
.step-tab:first-child .step-tab-in { padding-left: 13px; }
.step-tab:last-child {
  --outer: polygon(0 0, calc(100% - var(--pt) - 1.5px) 0, calc(100% - var(--pt) + 1.4px) 2px, calc(100% - 3.26px) calc(50% - 4.6px), calc(100% - 2.17px) calc(50% - 2.4px), calc(100% - 1.8px) 50%, calc(100% - 2.17px) calc(50% + 2.4px), calc(100% - 3.26px) calc(50% + 4.6px), calc(100% - var(--pt) + 1.4px) calc(100% - 2px), calc(100% - var(--pt) - 1.5px) 100%, 0 100%, var(--pt) 50%);
  --inner: polygon(calc(var(--bk) + var(--d)) 0, calc(100% - var(--pt) + var(--bk) - var(--d) - 1.5px) 0, calc(100% - var(--pt) + var(--bk) - var(--d) + 1.4px) 2px, calc(100% - 4.48px) calc(50% - 3.73px), calc(100% - 3.6px) calc(50% - 1.95px), calc(100% - 3.3px) 50%, calc(100% - 3.6px) calc(50% + 1.95px), calc(100% - 4.48px) calc(50% + 3.73px), calc(100% - var(--pt) + var(--bk) - var(--d) + 1.4px) calc(100% - 2px), calc(100% - var(--pt) + var(--bk) - var(--d) - 1.5px) 100%, calc(var(--bk) + var(--d)) 100%, calc(var(--pt) + var(--d)) 50%); }
.tabs.icons .step-tab:not(.on) .tl { display: none; }
.tabs.icons .step-tab:not(.on) .step-tab-in { padding-right: 12px; }

/* theme toggle */
.theme { display: inline-flex; gap: 2px; padding: 2px; flex: none; border: 1.5px solid var(--line); border-radius: 10px; background: var(--hdr-chip); box-shadow: 1.5px 1.5px 0 var(--sh); height: 34px; }
.theme i { display: grid; place-items: center; width: 28px; border-radius: 7px; color: var(--hdr-ink); font-style: normal; }
.theme i.on { background: var(--hdr-ink); color: var(--hdr-chip); }

/* buttons / seg / notice / progress / badge */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex: none; height: 32px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  font-weight: 700; font-size: 13px; white-space: nowrap; box-shadow: 2px 2px 0 var(--sh); }
.btn.sq { width: 32px; padding: 0; }
.btn.lg { height: 40px; border-radius: 12px; padding: 0 18px; font-size: 14px; }
.btn.pri { background: var(--yellow); color: var(--on-yellow); border-color: var(--fill-line); }
.btn.dis { opacity: .5; box-shadow: 2px 2px 0 var(--sh); }
.btn.rej { color: var(--red); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.err { background: var(--err-bg); border-color: color-mix(in srgb, var(--err-bd) 60%, transparent); }
.seg { color: var(--ink); display: inline-flex; gap: 2px; flex: none; padding: 2px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); }
.seg > b { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 6px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.seg > b .ic { width: 15px; height: 15px; }
.seg > b.on { background: var(--ink); color: var(--paper); }
.seg > b em { font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .75; }
.seg.scope > b.mono, .seg.scope > b .mono { font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 12px; }
.sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-muted); flex: none; }
.sdot.un { background: transparent; border: 1.5px dashed var(--ink-muted); }
.seg > b.on .sdot { background: var(--paper); border-color: var(--paper); }
.seg > b.on .sdot.un { background: transparent; }
.nt { display: inline-flex; align-items: center; gap: 8px; flex: none; min-height: 30px; padding: 3px 12px 3px 4px; border: 1px solid; border-radius: 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.nt i { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--n); color: var(--hdr-ink); flex: none; }
.nt i .ic { width: 12px; height: 12px; stroke-width: 3; }
.nt.flat { background: var(--paper-2); border-color: var(--line); --n: var(--sunken); }
.nt.flat i { color: var(--ink); }
.nt.info { background: var(--info-bg); border-color: color-mix(in srgb, var(--info-bd) 50%, transparent); --n: var(--info-ic); }
.nt.ok { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok-bd) 50%, transparent); --n: var(--ok-ic); }
.nt.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn-bd) 50%, transparent); --n: var(--warn-ic); }
.nt.err { background: var(--err-bg); border-color: color-mix(in srgb, var(--err-bd) 50%, transparent); --n: var(--err-ic); }
.nt.sm { min-height: 26px; font-size: 12px; padding-right: 10px; }
.nt.sm i { width: 18px; height: 18px; } .nt.sm i .ic { width: 10px; height: 10px; }
.prog { position: relative; display: block; flex: none; width: 110px; height: 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--ink); }
.vbar { display: flex; flex: none; height: 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.vbar > i { display: block; height: 100%; }
.vbar > i + i { border-left: 1.5px solid var(--paper-2); }
.vbar .a { background: var(--green); } .vbar .r { background: var(--red-solid); } .vbar .c { background: var(--st-m); }
.bd { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--pink); color: var(--hdr-ink); border: 1.5px solid var(--fill-line); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bd.ink { background: var(--ink); color: var(--paper); border-color: transparent; }
.stat { font: 700 13px 'Geist Mono', monospace; display: inline-flex; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .a { color: var(--green); } .stat .d { color: var(--red); }
.nm { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.nm strong { color: var(--ink); }
.vc { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vc .ic { width: 14px; height: 14px; stroke-width: 3; }
.vc.a { color: var(--green); } .vc.r { color: var(--red); } .vc.c { color: var(--st-m); } .vc.n { color: var(--ink-muted); }
.kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); font: 600 11px 'Space Grotesk', sans-serif; box-shadow: 1px 1px 0 var(--sh); color: var(--ink); }
.eb { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); }

/* status bar / today */
.status { display: flex; align-items: center; gap: 16px; height: 54px; padding: 0 20px; background: var(--paper); border-bottom: 1.5px solid var(--line); font-size: 13px; flex: none; }
.body { flex: 1; min-height: 0; display: flex; position: relative; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.strip { height: 79px; flex: none; display: flex; align-items: flex-start; padding: 7px 20px 0 22px; background: var(--paper-2); border-bottom: 1.5px solid var(--line); overflow: hidden; }
.tn { position: relative; display: flex; flex-direction: column; align-items: center; width: 118px; flex: none; }
.tn .nd { position: relative; z-index: 1; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--paper-2); }
.tn .nd.ring { background: var(--ink); color: var(--paper); border: 1.5px solid var(--ink); box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3.5px var(--ink); }
.tn .nd.ring .ic { width: 12px; height: 12px; }
.tn .nd.dot::after { content: ''; width: 13px; height: 13px; border-radius: 50%; background: var(--ink-muted); border: 1.5px solid var(--ink-muted); }
.tn .nd.dot.un::after { background: var(--paper-2); border: 1.5px dashed var(--ink-muted); }
.tn::before { content: ''; position: absolute; top: 11px; left: -59px; width: 118px; border-top: 1.5px solid var(--line); }
.tn.un::before { border-top-style: dashed; }
.tn:first-child::before { display: none; }
.tn .p { margin-top: 5px; font: 600 11.5px/14px 'Geist Mono', monospace; }
.tn .s { font-size: 10.5px; line-height: 14px; color: var(--ink-muted); white-space: nowrap; }
.tn.on .p { font-weight: 700; }

/* sidebar */
.side { flex: none; width: 272px; display: flex; flex-direction: column; min-height: 0; background: var(--paper-2); border-right: 1.5px solid var(--line); padding: 14px 10px 6px; overflow: hidden; }
.side .sh { display: flex; align-items: center; gap: 8px; padding: 0 8px 10px; }
.side .sh strong { font-size: 15px; }
.ghost { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; font-style: normal; color: var(--ink); }
.ghost .ic { width: 14px; height: 14px; }
.filter { display: flex; align-items: center; gap: 8px; height: 36px; flex: none; margin: 0 0 10px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink-muted); font-size: 13.5px; }
.scopebtn { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; flex: none; margin: 0 0 10px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 2px 2px 0 var(--sh); font-size: 13px; font-weight: 700; }
.scopebtn .m { color: var(--ink-muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
.scopebtn .eb { font-size: 10px; letter-spacing: .08em; }
.tree { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 0; }
.tr { display: flex; align-items: center; gap: 7px; height: 32px; flex: none; padding: 0 8px; border: 1.5px solid transparent; border-radius: 9px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.tr .ic { width: 15px; height: 15px; color: var(--ink-muted); stroke-width: 2.25; }
.tr.fo { font-weight: 700; }
.tr .chev { width: 13px; height: 13px; }
.tr .nmx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tr .cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.tr.file .nmx { font: 500 12.5px 'Geist Mono', monospace; }
.tr.del .nmx { text-decoration: line-through; color: var(--ink-muted); }

/* ===================== header B on every page: new styles ===================== */

/* ---- deck deltas ---- */

function reviewBlock(m, st, compact = false) {
  const r = m.rev, rv = reviewed(m), left = r.total - rv;
  const sug = r.rejected + r.commented > 0 ? 'Request changes' : r.approved > 0 ? 'Approve' : null;
  let nt, sg = '';
  if (st === 'approved') nt = notice('ok', 'check', 'Approved · sent', true);
  else if (st === 'updated') nt = notice('warn', 'refresh', 'Updated since sent', true);
  else if (st === 'ready') nt = notice('ok', 'check', 'Ready to submit', true);
  else if (st === 'failed') nt = notice('err', 'alert', `Run failed <span style="font-weight:500">· ${m.open} open comments</span>`, true);
  else if (st === 'working') nt = notice('info', 'bot', 'Claude Code is working…', true) + '<span class="pulse" title="Live"></span>';
  else if (rv === 0) nt = notice('info', 'clock', 'Awaiting review', true);
  else nt = notice('flat', 'lchecks', 'In progress', true);
  if (st === 'working') sg = '';
  else if (st === 'approved' || st === 'updated' || (st === 'ready' && PRC.opt === 'C')) sg = prReviewRow();
  else if (sug) sg = `<div class="rr4"><span>${st === 'ready' ? 'Decision' : 'Suggested decision'}</span>${decTag(sug)}</div>`;
  else sg = `<div class="rr4"><span>Suggested decision</span><span style="font-weight:500">after your first verdict</span></div>`;
  if (compact) {
    const sgc = st === 'approved' || st === 'updated' ? prReviewCompact() : st === 'working' ? '' : sug ? decTag(sug) : '';
    return `<div class="rrev compact" data-rrev="${st}">
    <div class="rr1"><strong>${rv}/${r.total}</strong>${vbar(m)}<span class="vc a">${ic('check')}${r.approved}</span><span class="vc r">${ic('x')}${r.rejected}</span><span class="vc c">${ic('msg')}${r.commented}</span></div>
    <div class="rr3" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${nt}${sgc}</div></div>`;
  }
  return `<div class="rrev" data-rrev="${st}">
    <div class="rr1"><strong>${rv}/${r.total}</strong>${vbar(m)}</div>
    <div class="rr2"><span class="vc a">${ic('check')}${r.approved}</span><span class="vc r">${ic('x')}${r.rejected}</span><span class="vc c">${ic('msg')}${r.commented}</span><span class="vc n">${left} not reviewed</span></div>

}

    <tr><td>Fit with header B</td><td>Good: identity is where facts live</td><td>Good for the journey; sixth tab is heavy</td><td>Best: no new surface</td><td>Breaks "no status in the bar"</td></tr></tbody></table>`;
  secs.push(sect('cmp', 'Σ', 'Comparison and recommendation', 'Recommendation: ship C now (split button for update, new PR or approve only), grow into A. C is small and covers choose, create, link and re-review on the page where you finish a review. A adds the popover details once checks and the GitHub-comments feature need a home. Details in <code>docs/pr-link-options.md</code>.', cmp, ''));

  document.getElementById('app').innerHTML = `<h1>PR link: where "a pull request was opened" shows up</h1>
    <p class="lede">Four ways to record and show the pull request for a session (Spec, Extras, Evidence, Files, Submit exist today). Same shell as header-b-pages.html (52px bar, 296px rail, flush timeline), same tokens, light and dark. Session: QI-15472 trial-app, approved and sent; PR #231 into master from feature/trial-bar. Fixture data is invented. Static mocks: nothing is clickable; popovers are shown open where they matter.</p>
    <nav class="toc">${[['vocab', 'states'], ['A', 'A chip + panel'], ['B', 'B sixth tab'], ['C', 'C status row'], ['D', 'D bar element'], ['cmp', 'compare']].map(([i, t]) => `<a href="#${i}">${t}</a>`).join('')}</nav>${secs.join('')}`;
}

/* =================== render =================== */
function placePops(fr) {
  const fer = fr.getBoundingClientRect();
  fr.querySelectorAll('[data-pop-anchor]').forEach((p) => {
    const a = fr.querySelector(`[data-anchor="${p.dataset.popAnchor}"]`);
    if (!a) return;
    const r = a.getBoundingClientRect(), pw = p.offsetWidth;
    if (p.dataset.side === 'below') { p.style.left = Math.max(8, Math.min(r.left - fer.left, fer.width - pw - 8)) + 'px'; p.style.top = (r.bottom - fer.top + 10) + 'px'; }
    else { p.style.left = Math.min(r.right - fer.left + 12, fer.width - pw - 8) + 'px'; p.style.top = (r.top - fer.top - 10) + 'px'; }
  });
}
function renderFrame(f) {
  const el = document.createElement('div');
  el.className = `fr th-${f.th} f${f.w}`;
  el.style.width = f.w + 'px'; el.style.height = f.h + 'px';
  el.innerHTML = f.build(null, f.w);
  if (f.prior) el.innerHTML = el.innerHTML.replaceAll('#231', '#232').replaceAll('/pull/231', '/pull/232');
  return el;
}
function layout() {
  document.querySelectorAll('.fw').forEach((fw) => {
    const f = frames.find((x) => x.id === fw.dataset.frame);
    const s = Math.min(1, fw.closest('.cell').clientWidth / f.w);
    fw.firstElementChild.style.transform = `scale(${s})`;
    fw.style.width = f.w * s + 'px'; fw.style.height = f.h * s + 'px';
  });
}
function init() {
  const solo = (location.hash.match(/solo=([\w.-]+)/) || [])[1];
  buildPage();
  if (solo) {
    document.body.className = 'solo-body';
    const f = frames.find((x) => x.id === solo);
    const app = document.getElementById('app');
    app.style.cssText = 'padding:0;max-width:none;margin:0';
    app.innerHTML = '<div id="soloFw"></div>';
    const fr = renderFrame(f);
    const fw = document.getElementById('soloFw'); fw.style.cssText = `width:${f.w}px;height:${f.h}px;overflow:hidden;position:relative`;
    fw.appendChild(fr); placePops(fr);
    window.__ready = true; return;
  }
  document.querySelectorAll('.fw').forEach((fw) => { const f = frames.find((x) => x.id === fw.dataset.frame); fw.appendChild(renderFrame(f)); });
  document.querySelectorAll('.fw').forEach((fw) => placePops(fw.firstElementChild));
  layout();
  window.addEventListener('resize', layout);
  new ResizeObserver(layout).observe(document.querySelector('.doc'));
  window.__ready = true;
}
document.fonts.ready.then(() => requestAnimationFrame(init));
</script>
