<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6B21E' stroke='%232B2A33' stroke-width='2'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='%232B2A33' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>review-dash</title>
    <script>
      // No-flash theme: mirror of ThemeProvider's logic (key `review-dash:theme`, `.dark` on <html>).
      ;(function () {
        try {
          var t = localStorage.getItem('review-dash:theme')
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
