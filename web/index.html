<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="scout-favicon" rel="icon" type="image/svg+xml" href="/brand/scout-favicon.svg" />
    <title>scout</title>
    <meta name="description" content="Scout — a companion for reviewing AI code changes and sending clear feedback." />
    <script>
      // No-flash theme: mirror of ThemeProvider's logic (key `scout:theme`, `.dark` on <html>).
      ;(function () {
        try {
          var t = localStorage.getItem('scout:theme')
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.getElementById('scout-favicon').setAttribute('href', '/brand/scout-favicon-dark.svg')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
